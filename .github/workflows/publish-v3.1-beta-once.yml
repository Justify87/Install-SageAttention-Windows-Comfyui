name: Publish v3.1 beta once

on:
  push:
    branches: [feature/python-installer]
    paths:
      - '.github/workflows/publish-v3.1-beta-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1.0-beta.1 \
            --repo "${{ github.repository }}" \
            --target 8d7a8db48f8d1cf729687202d9a23a6456b5851e \
            --title "Version 3.1 Beta 1" \
            --prerelease \
            --notes-file - <<'EOF'
          ## Python installer + SageAttention 2/3 — Beta

          This release adds a **Python installer** alongside the existing PowerShell installer for ComfyUI Windows Portable.

          ### Highlights
          - Beginner-friendly `Install-SageAttention-Python.bat` launcher using ComfyUI's own `python_embeded\python.exe`; no separate Python or PowerShell 7 installation is needed for this path.
          - Standard-library-only installer main process: Torch, Triton and SageAttention native packages are probed and verified only in short-lived child processes.
          - Supports **Auto**, **Sage2**, **Sage3**, and **Both** with the same source priority, recommendation policy, backup/recovery model and Torch read-only rules as the PowerShell installer.
          - Official Comfy-Org wheels are preferred; `wildminder/AI-windows-whl` remains an explicit community fallback.
          - Review updated current SageAttention 3 requirements: Python 3.13+, PyTorch 2.8+, CUDA 12.8+, with upstream runtime handling for Blackwell sm_100/sm_120/sm_121 while wheel architecture coverage is checked separately.
          - Legacy `triton` conflict removal now fails closed during normal installation; recovery remains best-effort.
          - **32 Python unit tests** and the **PowerShell resolver/parity smoke test** passed before release.

          ### Beta status
          Real Windows/NVIDIA end-to-end GPU validation has not yet been completed broadly enough to remove the Beta label. The installers include real Triton/SageAttention GPU verification, but this release does not claim successful execution on every supported hardware combination.

          See the README and PR #9 for full details.
          EOF
