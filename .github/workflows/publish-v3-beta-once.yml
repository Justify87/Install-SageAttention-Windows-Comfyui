name: Publish v3 beta once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3-beta-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.0.0-beta.1 \
            --repo "${{ github.repository }}" \
            --target 5d2fe4a31857a040436723811ea3bb4f2221d91b \
            --title "Version 3.0 Beta 1" \
            --prerelease \
            --notes-file - <<'EOF'
          ## SageAttention 2 + 3 — Beta

          - Adds guided support for **SageAttention 2.2/2++ and SageAttention 3**, including `Auto`, `Sage2`, `Sage3`, and `Both` modes.
          - Detects GPU/ComfyUI compatibility, recommends the appropriate backend, and prefers official wheels with an explicit community fallback when needed.
          - Improves the CLI with clearer guidance, progress, logging, backup/recovery, and real GPU verification.
          - **Beta:** this version has not yet been validated end-to-end on a real Windows/NVIDIA ComfyUI Portable system.

          See the repository README for full details and usage instructions.
          EOF