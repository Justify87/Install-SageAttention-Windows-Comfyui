name: Publish v2 beta once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2-beta-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0-beta.1 \
            --repo "${{ github.repository }}" \
            --target e8080f7c34bb4a651adad213e6e430a79abbdaa7 \
            --title "Version 2.0 Beta 1" \
            --prerelease \
            --notes-file - <<'EOF'
          ## Complete rewrite — Beta

          This release completely replaces v1.x. The installer was rewritten from scratch because the current ComfyUI Portable, Triton-Windows and SageAttention ecosystem has changed substantially and the old environment-management approach is no longer appropriate.

          **Highlights**
          - Torch is now read-only; the installer only manages compatible Triton + SageAttention components.
          - Official sources are preferred, with an explicit community SageAttention fallback only when required.
          - Safer Detect → Plan → Backup → Stage → Install → Verify → Recover flow, including real GPU smoke tests.
          - Simpler, more beginner-friendly operation with `-DryRun`, logs and automatic recovery.

          **Beta:** the new installer has not yet been validated end-to-end on a real Windows/NVIDIA ComfyUI Portable system. Please treat this as an early test release and report issues.

          See the repository README for installation instructions and full details.
          EOF
